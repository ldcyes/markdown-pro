[package]
name = "markdown-pro"
version = "0.1.2"
description = "A Typora-style Markdown editor"
authors = ["Dacheng Liang <liangdacheng603@gmail.com>"]
license = "MIT"
repository = "https://github.com/ldcyes/markdown-pro"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.25"
objc = "0.2"

[target."cfg(target_os = \"ios\")".dependencies]
libc = "0.2"
