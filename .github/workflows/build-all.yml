name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm build

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: dist/

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt install -y mingw-w64

      - name: Install dependencies
        run: pnpm install

      - name: Init Tauri
        run: |
          pnpm add -D @tauri-apps/cli@next @tauri-apps/api@next
          pnpm tauri init || true

      - name: Build Windows
        run: pnpm tauri build --target x86_64-pc-windows-gnu

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: pnpm install

      - name: Init Tauri
        run: |
          pnpm add -D @tauri-apps/cli@next @tauri-apps/api@next
          pnpm tauri init || true

      - name: Init Android
        run: pnpm tauri android init

      - name: Build Android
        run: pnpm tauri android build --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-build
          path: src-tauri/gen/android/app/build/outputs/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install

      - name: Init Tauri
        run: |
          pnpm add -D @tauri-apps/cli@next @tauri-apps/api@next
          pnpm tauri init || true

      - name: Build macOS
        run: pnpm tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: macos-build
          path: src-tauri/target/release/bundle/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install dependencies
        run: pnpm install

      - name: Init Tauri
        run: |
          pnpm add -D @tauri-apps/cli@next @tauri-apps/api@next
          pnpm tauri init || true

      - name: Init iOS
        run: pnpm tauri ios init

      - name: Build iOS
        run: pnpm tauri ios build --release

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: src-tauri/target/aarch64-apple-ios/release/

  release:
    needs: [build-web, build-windows, build-android, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-build/msi/*.msi
            windows-build/nsis/*.exe
            android-build/apk/release/*.apk
            android-build/bundle/release/*.aab
            macos-build/dmg/*.dmg
            macos-build/macos/*.app
            ios-build/*.ipa
            web-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
