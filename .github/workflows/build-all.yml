name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: npx vite build

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: dist/

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install Tauri CLI
        run: |
          pnpm add -D @tauri-apps/cli@next @tauri-apps/api@next
          pnpm tauri info || true

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Tauri
        run: pnpm tauri init || true

      - name: Build Desktop App
        run: pnpm tauri build
        continue-on-error: true

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: desktop-build
          path: src-tauri/target/release/bundle/

  release:
    needs: [build-web, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/*}" >> $GITHUB_ENV
echo "Building version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Markdown Pro ${{ env.VERSION }}
          body: |
            ## 🎉 Multi-platform Markdown Editor
            
            Typora-style WYSIWYG editor with support for:
            - Web (all browsers)
            - Desktop (Windows, macOS, Linux)
            - Mobile (Android, iOS - requires separate build)
            
            ## ✨ Features
            - LaTeX formula support (KaTeX)
            - Mermaid diagrams
            - Image upload with cropping
            - Table editing
            - Dark/light themes
            
            ## 📦 Downloads
            | Platform | File |
            |----------|------|
            | Web | dist/ |
            | Desktop | MSI, DMG, AppImage |
            
            Built with ❤️ using Tauri + React + ProseMirror
          draft: false
          files: |
            web-build/*
            desktop-build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
